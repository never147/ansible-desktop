---
- name: Install GitHub CLI
  include_tasks:
    file: github.yml

- name: Installing apt packages for development
  apt:
    name: "{{ dev_toolchain_packages }}"
    state: latest

- name: Install npm packages
  community.general.npm:
    name: "{{ item }}"
    global: true
  loop:
    - markdown-table-formatter

- name: Install DeadSnakes Python
  include_tasks:
    file: deadsnakes-python.yml
  when:
    dev_toolchain_install_deadsnakes
