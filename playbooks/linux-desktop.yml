---
- hosts: all
  environment: "{{ proxy_env }}"
  pre_tasks:
    - setup:
    - set_fact:
        os_distro: "{{ ansible_distribution }}"
      tags: always
    - set_fact:
        os_distro: "ubuntu"
      tags: always
      when: os_distro == "Linux Mint"
    - set_fact:
        os_codename: "{{
            os_codenames[ansible_distribution_release]
            |default(ansible_distribution_release)
          }}"
      tags: always
    - debug:
        msg: "{{ os_codename }}"
      tags: always
  roles:
    - role: apt
      tags:
        - apt_update
    - role: security
      tags:
        - security
    - role: authnz
      tags:
        - authnz
        - security
    #- role: ansible
    #  tags:
    #    - ansible
    #    - configuration
    - role: network
      tags:
        - system
        - network
    - role: backup
      tags:
        - system
        - backup
    - role: kernel
      tags:
        - kernel
    - role: desktop-apps
      tags:
        - desktop-apps
        - apps
        - desktop
    - role: chrome
      tags:
        - apps
        - desktop
        - chrome
    - role: dev-toolchain
      tags:
        - development
        - desktop
        - dev-toolchain
    - role: docker
      tags:
        - docker
        - no-ci
        - system
        - virtual
    - role: golang
      tags:
        - languages
        - development
        - golang
    - role: gopass
      tags:
        - collaboration
        - security
        - desktop
        - apps
        - gopass
    #- role: grub
    #  tags:
    #    - no-ci
    #    - system
    - role: rbw
      tags:
        - security
        - desktop
        - apps
        - rbw
    - role: hid-apple
      tags:
        - system
        - devices
        - hid-apple
        - no-ci
    - role: jabra
      tags:
        - collaboration
        - communication
        - desktop
        - devices
    - role: postfix
      tags:
        - system
        - communication
        - postfix
    - role: power-save
      tags:
        - system
        - devices
        - no-ci
        - power-save
    - role: shorewall
      tags:
        - no-ci
    - role: slack
      tags:
        - apps
        - desktop
        - communication
        - collaboration
    - role: virtualbox
      tags:
        - system
        - apps
        - desktop
        - no-ci
        - virtual
        - virtualbox
    #- role: yubikey
    #  tags:
    #    - system
    #    - devices
    #    - security
    #    - yubico
    - role: zoom
      tags:
        - zoom
        - communication
        - apps
        - desktop
        - collaboration
    #- role: chef
    #  tags:
    #    - chef
    #    - development
    - role: vagrant
      tags:
        - vagrant
        - development
        - virtual
    - role: jetbrains
      tags:
        - jetbrains
        - development

